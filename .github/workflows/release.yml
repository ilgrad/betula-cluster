name: Release

# Build redistributable wheels for every platform and (on a version tag) publish to PyPI.
# Publishing uses PyPI Trusted Publishing (OIDC) — configure a trusted publisher for this repo at
# https://pypi.org/manage/project/betula-cluster/settings/publishing/ before pushing a `v*` tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          # macOS x86_64 is cross-built on the arm64 macos-14 runner: dedicated Intel (macos-13)
          # runners are scarce/deprecated and queue for tens of minutes. abi3 needs no interpreter at
          # build time, so cross-compiling x86_64-apple-darwin here is sound.
          - { runner: macos-14, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  wheels-freethreaded:
    # abi3 cannot serve a free-threaded interpreter, by construction: `Py_GIL_DISABLED=1` builds
    # expose SOABI `cpython-314t` and no abi3 tag at all, so the `cp311-abi3` wheels above match
    # nothing on 3.14t and `pip install betula-cluster` there falls back to building from source --
    # which needs a Rust toolchain the user did not ask for. maturin drops abi3 on its own for these
    # ("abi3 does not yet support CPython 3.14t ... artifacts will be version-specific"), so the only
    # thing missing was the build arm. 3.14t gets a version-specific wheel; from 3.15 one `abi3t`
    # wheel (PEP 803) serves 3.15t and every later free-threaded minor, and the GIL builds of 3.15+
    # too. abi3t is enabled for that arm alone: with `abi3t-py315` in Cargo.toml, any build that
    # finds a 3.15 interpreter -- the `wheels` arm above on a `3.x` that has moved to 3.15 -- would
    # emit only the abi3t wheel and drop `cp311-abi3`, the one that serves 3.11-3.14.
    #
    # Measured locally on cpython-3.14.7+freethreaded before adding this: the module imports without
    # re-enabling the GIL (`sys._is_gil_enabled()` stays False, and pyo3 0.29 emits no
    # `Py_MOD_GIL_USED` warning), labels are correct, and four Python threads each running a full
    # `fit_predict` over 6000x8 finish in 0.26 s against 0.22 s for one -- 4x the work for 1.2x the
    # time, alternated A-B-A-B. So the extension really does run concurrently there; this arm ships a
    # capability, not just an install convenience.
    name: wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }} (${{ matrix.python }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14t", "3.15t"]
        include:
          - { python: "3.14t", features: "python" }
          - { python: "3.15t", features: "python,pyo3/abi3t-py315" }
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          # No macOS x86_64 here. The abi3 arm above cross-builds it on macos-14 precisely because
          # abi3 needs no interpreter at build time; a version-specific build does, and there is no
          # x86_64 free-threaded interpreter to point `--interpreter` at on an arm64 runner.
          - { runner: macos-14, target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # `python3.14t`, not `3.14t`: maturin's documented form for a free-threaded interpreter is
          # the executable name, and on Linux the build runs inside a manylinux container where the
          # setup-python above is not visible at all -- the name has to resolve to the container's
          # own /opt/python/cp314-cp314t/bin/python3.14t.
          # `--features` replaces pyproject's `features = ["python"]`, so `python` is listed again.
          args: --release --out dist --interpreter python${{ matrix.python }} --features ${{ matrix.features }}
          manylinux: auto
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-ft-${{ matrix.python }}-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, wheels-freethreaded, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    name: publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # OIDC token for crates.io Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Tokenless Trusted Publishing (OIDC), like the PyPI job above. Configure a trusted publisher for
      # this repo once at https://crates.io/crates/betula-cluster/settings before the first `v*` tag.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - name: Extract this version's CHANGELOG section
        # GitHub caps a release body at 125 000 characters and rejects anything longer with a 422.
        # That would fail *after* the wheels are already on PyPI and the crate on crates.io, leaving
        # a published version with no Release and no Zenodo archive. It is not hypothetical: 0.6.0's
        # section is 16 649 bytes and published fine, 0.8.0's is 172 863. Truncate on a line
        # boundary and point at the file that holds the whole thing.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > full-notes.md
          limit=110000   # bytes, so a multi-byte page is always under the character cap
          if [ "$(wc -c < full-notes.md)" -gt "$limit" ]; then
            head -c "$limit" full-notes.md | sed '$d' > release-notes.md
            {
              printf '\n---\n\n'
              printf 'This section is longer than a GitHub release body may be, and is truncated here.\n'
              printf 'The full text is in [CHANGELOG.md](%s/blob/%s/CHANGELOG.md).\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            } >> release-notes.md
          else
            cp full-notes.md release-notes.md
          fi
          echo "----- release notes: $(wc -c < release-notes.md) of $(wc -c < full-notes.md) bytes -----"
          head -40 release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: betula-cluster ${{ github.ref_name }}
          body_path: release-notes.md
