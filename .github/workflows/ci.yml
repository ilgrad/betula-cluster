name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-llvm-cov
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default = parallel)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (no-default-features = serial)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: clippy (persistence)
        run: cargo clippy --no-default-features --features persistence --all-targets -- -D warnings
      - name: clippy (cli)
        run: cargo clippy --features cli --bin betula -- -D warnings
      - name: test (default)
        run: cargo test
      - name: test (serial)
        run: cargo test --no-default-features
      - name: test (parallel + persistence)
        run: cargo test --features persistence
      - name: test (cli)
        run: cargo test --features cli --bin betula
      - name: cargo audit (security / unmaintained advisories)
        run: cargo audit
      - name: coverage (llvm-cov, floor 95% lines; core + persistence + cli)
        run: cargo llvm-cov --features persistence,cli --summary-only --fail-under-lines 95

  msrv:
    # `rust-version = "1.85"` in Cargo.toml was a claim nothing checked -- the previous floor, 1.82,
    # was never verified either. 1.85 is the Rust 2024 edition's own floor, and the dependency graph
    # sits right on it (getrandom 0.4.3, proptest 1.11, wit-bindgen 0.57.1 all declare 1.85), so it
    # is exactly the kind of number that rots silently. `Cargo.lock` is gitignored here, so this job
    # resolves fresh and checks the floor a consumer would actually hit.
    # Verified locally before landing: `cargo +1.85.0 check --all-features --all-targets` passes.
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The ref is the Rust toolchain this job installs -- the MSRV under test -- not a version of
      # the action. Bumping it does not update a dependency, it deletes the gate and leaves the job
      # green while testing nothing the declared floor guarantees. `.github/dependabot.yml` ignores
      # this action for exactly that reason; raise the floor here only together with `rust-version`
      # in `Cargo.toml` and a CHANGELOG entry.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: check on the declared minimum supported Rust version
        run: cargo check --all-features --all-targets

  semver:
    # The crate's contract is thirteen modules (`README.md`, *Compatibility*); everything else is
    # `#[doc(hidden)]` and free to move. This job makes a break in the thirteen visible in the pull
    # request that causes it instead of after a release, which is the whole point of curating them.
    #
    # It gates, and it can: measured on this tree, `0.8.0 -> 1.0.0 (major change)` is "no semver
    # update required" -- a major bump permits every one of the six breaking classes the curation,
    # `n_init` and the `try_` constructors introduce, so the job is green today and stays green
    # after 1.0.0 is published, when the baseline becomes 1.0.0 itself. A pull request that breaks
    # the thirteen modules without a major bump is then the only thing that turns it red, which is
    # what the promise in `CHANGELOG.md` means.
    #
    # No `--baseline-version`: with none given the tool resolves the latest version published on
    # crates.io, so the baseline follows the releases instead of rotting in this file.
    name: semver (public surface vs the last release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks
        run: cargo semver-checks

  python-build:
    name: python (build · clippy)
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      # `examples/` is linted but deliberately not formatted: each `.py` there is one half of a
      # jupytext pair, and reflowing a cell desyncs it from the `.ipynb` nothing here re-executes.
      # The four rules that describe the notebook form rather than a defect are in `pyproject.toml`.
      - name: ruff check
        run: uvx ruff check python/ tests/ bench/ examples/
      - name: ruff format --check
        run: uvx ruff format --check python/ tests/ bench/
      - name: ty check
        run: uv run --with ty --with numpy ty check python/betula_cluster
      - name: clippy (python bindings)
        run: cargo clippy --features python -- -D warnings
      - name: build abi3 wheel
        run: uv run --with maturin maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
      - name: sdist (build + install-from-source smoke test)
        run: |
          uv run --with maturin maturin sdist --out dist
          uv run --refresh --with "$(ls dist/*.tar.gz | head -1)" \
            python -c "import betula_cluster as b; print('sdist import ok', b.__version__)"
      # Canonical 100% wrapper-coverage gate: one stable interpreter with the full optional test deps,
      # so the optional-dep code paths (scipy.sparse / networkx) actually run. Kept off the 3.11–3.14
      # matrix on purpose — coverage is interpreter-independent, and installing SciPy/sklearn on a
      # brand-new Python is the flaky part.
      - name: pytest (wrapper coverage, floor 100%)
        run: |
          uv run --python 3.12 \
            --with numpy --with "scikit-learn>=1.3" --with scipy --with networkx \
            --with pytest --with pytest-cov --with "$(ls dist/*.whl | head -1)" \
            pytest tests/test_python.py -q --cov=betula_cluster --cov-fail-under=100

  python-test:
    name: python (pytest · py${{ matrix.python-version }})
    needs: python-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      # The single abi3 wheel must import and the whole suite must pass on every interpreter.
      # Only NumPy + the wheel are installed here (robust on brand-new Pythons whose SciPy / sklearn
      # wheels can still lag): the optional-dep tests skip cleanly. The 100% wrapper-coverage floor is
      # gated separately, on the `python-build` (Linux 3.12) and `python-test-os` (macOS/Windows) jobs,
      # which install the full test deps on a stable interpreter.
      - name: pytest (abi3 wheel imports + suite passes)
        run: |
          wheel=$(ls dist/*.whl | head -1)
          uv run --python ${{ matrix.python-version }} \
            --with numpy --with pytest --with "$wheel" \
            pytest tests/test_python.py -q
      - name: stubtest
        run: |
          wheel=$(ls dist/*.whl | head -1)
          uv run --python ${{ matrix.python-version }} --with mypy --with numpy --with "$wheel" \
            python -m mypy.stubtest betula_cluster

  python-test-freethreaded:
    # The abi3 wheel cannot serve a free-threaded interpreter: `Py_GIL_DISABLED=1` exposes SOABI
    # `cpython-314t` and no abi3 tag at all, so `python-test` above cannot reach 3.14t and
    # release.yml builds it a version-specific wheel of its own. Build from source here and check
    # the two things that wheel claims. The GIL assertion is the load-bearing one: a `#[pymodule]`
    # that declares `Py_MOD_GIL_USED` turns free threading back off for the *whole process* on
    # import, which makes shipping the wheel worse than shipping none -- and it does that with a
    # warning, not an error, so only an assertion catches it.
    #
    # NumPy and pytest only, as in `python-test`: SciPy and scikit-learn wheels lag on a new
    # free-threaded interpreter, and the tests that need them skip cleanly.
    name: python (pytest · 3.14t free-threaded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      - name: build (maturin develop) + GIL check + pytest
        run: |
          uv venv --python 3.14t
          uv pip install maturin numpy pytest
          # --no-sync: the repo pins .python-version=3.14, so a plain `uv run` rejects this
          # deliberately-3.14t venv, recreates it, and discards the tools installed above.
          uv run --no-sync maturin develop --release
          uv run --no-sync python -c "
          import sys, betula_cluster
          assert not sys._is_gil_enabled(), 'importing betula_cluster re-enabled the GIL'
          print('GIL stays disabled on import; betula_cluster', betula_cluster.__version__)
          "
          uv run --no-sync pytest tests/test_python.py -q

  python-test-os:
    name: python (pytest · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      # The published abi3 wheel is Linux-only in CI; build from source here so the extension is
      # exercised natively on macOS and Windows (where release.yml also ships wheels).
      - name: build (maturin develop) + pytest (wrapper coverage, floor 100%)
        run: |
          uv venv --python 3.12
          uv pip install maturin numpy "scikit-learn>=1.3" scipy networkx pytest pytest-cov
          # --no-sync is load-bearing: the repo pins .python-version=3.14, so a plain `uv run`
          # rejects this deliberately-3.12 venv, recreates it, and discards the tools just
          # installed above ("Failed to spawn: maturin").
          uv run --no-sync maturin develop --release
          uv run --no-sync pytest tests/test_python.py -q --cov=betula_cluster --cov-fail-under=100

  threads:
    # `RAYON_NUM_THREADS` must not change an answer, and once it did: a work-stealing float
    # `fold`/`reduce` in `nmf.rs` made `components_` a function of how the threads interleaved --
    # invisible at one thread, twenty different answers at eight. `tests/test_python.py` pins that
    # one head. This job is the library-wide form, because the next parallel reduction will land in
    # some other head and nothing in the suite would see it.
    name: threads (the pool size must not change the answer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      - name: every head, fitted at 1 and 8 threads, compared by digest
        run: |
          uv venv --python 3.12
          uv pip install maturin numpy
          # --no-sync: the repo pins .python-version=3.14, so a plain `uv run` rejects this venv
          # and recreates it, discarding maturin. Same reason as in `python-test-os` above.
          uv run --no-sync maturin develop --release
          uv run --no-sync python scripts/thread_determinism.py

  arm64-kernels:
    # The SIMD distance kernels are the crate's only `unsafe` (ADR 003) and the NEON half has never
    # had a number attached to it -- every machine that has run this sweep was x86_64. Apple-silicon
    # runner, `cargo bench --bench kernels`, printed to the step summary.
    #
    # Reports, never gates: a hosted runner's absolute timings are far too noisy to ratchet against,
    # and what is missing is not a threshold but any aarch64 measurement at all. Pushes only -- it is
    # the one job here that costs real runner minutes, and a PR cannot change the timing without
    # changing the kernels, which the `rust` job already tests on every event.
    name: kernels (arm64 timing smoke)
    runs-on: macos-14
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --bench kernels
        run: |
          { echo '## Distance kernels on aarch64'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cargo bench --bench kernels | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  scoreboard:
    # The benchmark CSVs are committed, so the win/tie/loss board can be re-derived without running
    # a single benchmark: this job costs seconds and catches the one failure mode the suite cannot,
    # which is a *result* moving backwards. Four wrong published claims of the 0.2.0 era survived a
    # month because nothing re-read these files between the run that produced them and the release.
    # It gates the recorded board only; producing new numbers is still a deliberate local act
    # (`bench/comprehensive.py`, then `--update` in the commit that explains the move).
    name: bench (scoreboard ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: scoreboard --check (no cell may regress)
        run: uv run --with pandas python bench/scoreboard.py --check
