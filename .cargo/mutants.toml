# cargo-mutants: mutation testing over the whole crate.
# `cargo mutants` (see .github/workflows/mutants.yml for the sharded scheduled run). There is no
# `examine_globs` on purpose -- scope is the crate, minus the two exclusions below. CI selects work
# with `--shard k/n`; a local run narrows with `-f <glob>` (which unions with `examine_globs`, so
# leaving that key out is what makes `-f` mean "only this").
#
# Measured mutant counts (`cargo mutants --list | wc -l`), for sizing the shard matrix. Re-count
# before changing that matrix -- this crate grew from 4312 to 6158 to 8927 between 2026-08-20,
# 2026-08-31 and 2026-09-07, and the shard sizing is the only thing that reads these numbers:
#   2026-08-20  4312     2026-08-31  6158     2026-09-07  8927
# Throughput is **~250 worker-seconds per mutant**, not the ~110 an earlier edition of this comment
# claimed: measured on run 33385956775, whose 95 collated shards carried 65 mutants each and took a
# median of 4085 s at -j4. A mutant that *survives* runs the whole suite to the end, and the tail is
# what sizes the cap -- that run's p90 shard was 7480 s and its slowest 7887 s.
# `scripts/check_mutants_baseline.py` prints the current count as a side effect.
exclude_globs = ["src/python.rs", "src/bin/**"]
# python.rs has no Rust-level test coverage (coverage runs --features persistence,cli, not python),
# so any mutant there is a false survivor; the CLI bin is a thin wrapper over the library.

# Floor the timeout so the proptest-heavy suite never spuriously times out under a mutant. Raised
# from 60: at high --jobs the mutant test runs contend and a 27 s suite was measured taking 141 s,
# which reported as a timeout rather than a result.
minimum_test_timeout = 300
