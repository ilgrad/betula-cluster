[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "betula-cluster"
version = "0.1.4"
description = "Fast, numerically stable BETULA clustering with a Rust core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE-MIT"]
authors = [{ name = "Ilia Gradina", email = "ilia.gradina@gmail.com" }]
keywords = [
    "clustering",
    "birch",
    "betula",
    "cf-tree",
    "microclustering",
    "embeddings",
    "gmm",
    "hdbscan",
    "unsupervised-learning",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
# `tune`: an optional TPE / multi-objective sampler backend for `betula_cluster.tune`; the default
# random-search path needs only NumPy.
tune = ["optuna>=3.0"]
# `docs`: MkDocs Material site with mkdocstrings API autodoc (see mkdocs.yml).
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/ilgrad/betula-cluster"
Repository = "https://github.com/ilgrad/betula-cluster"
Documentation = "https://ilgrad.github.io/betula-cluster/"
Issues = "https://github.com/ilgrad/betula-cluster/issues"
Changelog = "https://github.com/ilgrad/betula-cluster/blob/main/CHANGELOG.md"

[tool.maturin]
features = ["python"]
module-name = "betula_cluster._core"
python-source = "python"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# μ / Σ / × / → etc. are intentional math notation in docstrings and comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Benchmark/spike harnesses set up the environment before importing, and print wide tables.
"bench/*" = ["E402", "E501"]

[tool.mutmut]
# Mutation testing (advisory, nightly — see .github/workflows/mutants.yml). Scoped to the two files
# with real numeric logic; 100% line coverage says nothing about assertion strength, mutmut does.
paths_to_mutate = "python/betula_cluster/tuning.py,python/betula_cluster/__init__.py"
tests_dir = "tests/"
runner = "python -m pytest -x -q tests/test_python.py"
