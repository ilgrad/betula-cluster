[package]
name = "rust-rivals"
version = "0.0.0"
edition = "2021"
publish = false

# A crate of its own, outside betula-cluster's manifest, so no rival enters its dependency tree.
[workspace]

[dependencies]
betula-cluster = { path = "../.." }
clump = "0.7"
hdbscan = "0.12"
linfa = "0.8"
linfa-clustering = "0.8.1"
ndarray = "0.16"
rand_xoshiro = "0.6"
