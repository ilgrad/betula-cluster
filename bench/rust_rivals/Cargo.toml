[package]
name = "rust-rivals"
version = "0.0.0"
edition = "2021"
publish = false

# A crate of its own, outside betula-cluster's manifest, so no rival enters its dependency tree.
[workspace]

[dependencies]
betula-cluster = { path = "../.." }
clump = "0.7"
hdbscan = "0.12"
linfa = "0.8"
linfa-clustering = "0.8.1"
ndarray = "0.16"
rand_xoshiro = "0.6"
anofox-ml-cluster = "0.6"
anofox-ml-core = "0.6"
scirs2-cluster = "0.6"
scirs2-core = { version = "0.6", default-features = false }
# AGPL-3.0: a dependency of this bench crate only, never of betula-cluster. The repository on GitHub
# mirrors https://codeberg.org/erich_schubert/fuel; the crate is not on crates.io (`fuel` there is
# another project).
fuel = { git = "https://github.com/kno10/fuel" }
rand_pcg = "0.10"
